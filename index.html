<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUAT Data Literacy Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom transition for the doughnut chart */
    .conic-transition {
      transition: background 0.5s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
  
  <!-- Root Container -->
  <div id="root"></div>

  <script>
    // --- Translation Dictionary ---
    const translations = {
      en: {
        title: "FUAT Dashboard",
        uploadBtn: "Upload FUAT.csv",
        province: "Province",
        district: "District",
        facility: "Health Facility",
        all: "All",
        sec1Title: "Section 1: Overview & Applied Knowledge",
        male: "Male",
        female: "Female",
        other: "Other",
        total: "Total Participants",
        appliedKnowledge: "Applied Skills/Knowledge ('Yes')",
        sec2Title: "Section 2: Applied Skills Insights",
        sec3Title: "Section 3: Application Challenges",
        sec4Title: "Section 4: Support Needed",
        noData: "No data available for this section based on current filters.",
        uploadPrompt: "Please upload your FUAT.csv dataset to visualize the insights.",
        summaryApplied: (count, total, pct) => `Based on the filtered data, ${count} out of ${total} (${pct}%) participants provided examples. Key Insights: Participants show highly active, day-to-day practical utilization, particularly in data quality checks (RDQA), data cleaning, and creating visualizations (dashboards, charts, PPTs) for management reports.`,
        summaryChallenges: (count, total, pct) => `Approximately ${count} participants (${pct}%) highlighted specific barriers. Key Insights: A major underlying theme is "isolated knowledge"—it is difficult to fully implement data-driven processes when colleagues do not share the same foundational data literacy skills.`,
        recommendationSec3: "Recommendation: Organize cross-training sessions or internal workshops where trained staff can share foundational data literacy skills with colleagues. This will help break down knowledge silos and foster a more collaborative data culture.",
        summarySupport: (count, total, pct) => `${count} participants (${pct}%) expressed a need for further support. Key Insights: The primary request is for continuous learning, specifically refresher training courses and extending data training to their coworkers to build a collaborative, data-driven team culture.`
      },
      lo: {
        title: "ກະດານຂໍ້ມູນ FUAT",
        uploadBtn: "ອັບໂຫລດ FUAT.csv",
        province: "ແຂວງ",
        district: "ເມືອງ",
        facility: "ສະຖານທີ່ສາທາລະນະສຸກ",
        all: "ທັງໝົດ",
        sec1Title: "ພາກທີ 1: ພາບລວມ ແລະ ການນຳໃຊ້ທັກສະ",
        male: "ຊາຍ",
        female: "ຍິງ",
        other: "ອື່ນໆ",
        total: "ຜູ້ເຂົ້າຮ່ວມທັງໝົດ",
        appliedKnowledge: "ໄດ້ນຳໃຊ້ຄວາມຮູ້/ທັກສະ ('Yes')",
        sec2Title: "ພາກທີ 2: ການນຳໃຊ້ທັກສະເຂົ້າໃນວຽກງານ",
        sec3Title: "ພາກທີ 3: ສິ່ງທ້າທາຍໃນການນຳໃຊ້ທັກສະ",
        sec4Title: "ພາກທີ 4: ການຊ່ວຍເຫຼືອທີ່ຕ້ອງການ",
        noData: "ບໍ່ມີຂໍ້ມູນສຳລັບພາກນີ້ ອີງຕາມການກັ່ນຕອງປັດຈຸບັນ.",
        uploadPrompt: "ກະລຸນາອັບໂຫລດໄຟລ໌ຂໍ້ມູນ FUAT.csv ຂອງທ່ານເພື່ອເບິ່ງກະດານຂໍ້ມູນ.",
        summaryApplied: (count, total, pct) => `ອີງຕາມຂໍ້ມູນທີ່ກັ່ນຕອງ, ${count} ໃນ ${total} (${pct}%) ຂອງຜູ້ເຂົ້າຮ່ວມໄດ້ໃຫ້ຕົວຢ່າງ. ບົດສະຫຼຸບຊີ້ໃຫ້ເຫັນເຖິງການນຳໃຊ້ຕົວຈິງໃນວຽກງານປະຈຳວັນ, ໂດຍສະເພາະແມ່ນການກວດກາຄຸນນະພາບຂໍ້ມູນ (RDQA), ການທຳຄວາມສະອາດຂໍ້ມູນ ແລະ ການສ້າງພາບຂໍ້ມູນ (Dashboard, ກຣາບ, PPT) ສຳລັບການລາຍງານການຄຸ້ມຄອງ.`,
        summaryChallenges: (count, total, pct) => `ມີປະມານ ${count} ທ່ານ (${pct}%) ໄດ້ຍົກໃຫ້ເຫັນເຖິງອຸປະສັກ. ບົດສະຫຼຸບຊີ້ໃຫ້ເຫັນວ່າສິ່ງທ້າທາຍຫຼັກແມ່ນ "ຄວາມຮູ້ທີ່ໂດດດ່ຽວ" - ມັນຍາກທີ່ຈະຈັດຕັ້ງປະຕິບັດວຽກງານທີ່ອີງໃສ່ຂໍ້ມູນໄດ້ຢ່າງເຕັມທີ່ ເມື່ອເພື່ອນຮ່ວມງານບໍ່ມີທັກສະດ້ານຂໍ້ມູນພື້ນຖານຄືກັນ.`,
        recommendationSec3: "ຂໍ້ແນະນຳ: ຈັດກອງປະຊຸມແລກປ່ຽນບົດຮຽນ ຫຼື ກິດຈະກຳແບ່ງປັນຄວາມຮູ້ພາຍໃນອົງກອນ ເພື່ອໃຫ້ພະນັກງານທີ່ຜ່ານການຝຶກອົບຮົມສາມາດແບ່ງປັນທັກສະດ້ານຂໍ້ມູນພື້ນຖານໃຫ້ແກ່ເພື່ອນຮ່ວມງານ. ສິ່ງນີ້ຈະຊ່ວຍແກ້ໄຂບັນຫາຄວາມຮູ້ທີ່ກະຈຸກຕົວ ແລະ ສ້າງວັດທະນະທຳການເຮັດວຽກທີ່ອີງໃສ່ຂໍ້ມູນຮ່ວມກັນ.",
        summarySupport: (count, total, pct) => `ຜູ້ເຂົ້າຮ່ວມ ${count} ທ່ານ (${pct}%) ໄດ້ສະແດງຄວາມຕ້ອງການການຊ່ວຍເຫຼືອ. ບົດສະຫຼຸບຊີ້ໃຫ້ເຫັນວ່າຄວາມຕ້ອງການຫຼັກແມ່ນການຮຽນຮູ້ຢ່າງຕໍ່ເນື່ອງ, ໂດຍສະເພາະແມ່ນການຝຶກອົບຮົມທົບທວນຄືນ ແລະ ການຂະຫຍາຍການຝຶກອົບຮົມໃຫ້ແກ່ເພື່ອນຮ່ວມງານ ເພື່ອສ້າງວັດທະນະທຳການເຮັດວຽກທີ່ອີງໃສ່ຂໍ້ມູນຮ່ວມກັນໃນທີມ.`
      }
    };

    // --- State Management ---
    const state = {
      lang: 'en',
      rawData: [],
      filters: { province: 'All', district: 'All', facility: 'All' }
    };

    // --- CSV Parser ---
    const parseCSV = (text) => {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;
      
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (inQuotes) {
          if (char === '"') {
            if (i + 1 < text.length && text[i + 1] === '"') {
              cur += '"'; i++; 
            } else {
              inQuotes = false;
            }
          } else {
            cur += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            row.push(cur.trim()); cur = '';
          } else if (char === '\n' || char === '\r') {
            if (char === '\r' && i + 1 < text.length && text[i + 1] === '\n') i++;
            row.push(cur.trim()); rows.push(row); row = []; cur = '';
          } else {
            cur += char;
          }
        }
      }
      if (cur || row.length > 0) {
        row.push(cur.trim()); rows.push(row);
      }
      return rows;
    };

    // --- Helper to escape HTML tags ---
    const escapeHTML = (str) => {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag));
    };

    // --- Event Handlers ---
    window.toggleLang = () => {
      state.lang = state.lang === 'en' ? 'lo' : 'en';
      render();
    };

    window.triggerFileInput = () => {
      document.getElementById('fileInput').click();
    };

    window.handleFileUpload = (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target.result;
        const rows = parseCSV(text);
        if (rows.length < 2) return;

        const headers = rows[0].map(h => h.toLowerCase());
        
        const parsedData = rows.slice(1).map(row => {
          const obj = {};
          headers.forEach((h, i) => {
            if (!row[i]) return;
            if (h.includes('province')) obj.province = row[i];
            else if (h.includes('district')) obj.district = row[i];
            else if (h.includes('facility')) obj.facility = row[i];
            else if (h.includes('gender')) obj.gender = row[i];
            else if (h.includes('skill knowledge using')) obj.skillUsing = row[i];
            else if (h.includes('example of how')) obj.applied = row[i];
            else if (h.includes('not able to apply')) obj.challenges = row[i];
            else if (h.includes('support would you need')) obj.support = row[i];
          });
          return obj;
        }).filter(d => d.province || d.gender);

        state.rawData = parsedData;
        state.filters = { province: 'All', district: 'All', facility: 'All' };
        render();
      };
      reader.readAsText(file);
    };

    window.updateFilter = (key, value) => {
      state.filters[key] = value;
      if (key === 'province') {
        state.filters.district = 'All';
        state.filters.facility = 'All';
      }
      if (key === 'district') {
        state.filters.facility = 'All';
      }
      render();
    };

    // --- Core Logic & Rendering ---
    const getComputedData = () => {
      let filtered = state.rawData;

      if (state.filters.province !== 'All') filtered = filtered.filter(d => d.province === state.filters.province);
      if (state.filters.district !== 'All') filtered = filtered.filter(d => d.district === state.filters.district);
      if (state.filters.facility !== 'All') filtered = filtered.filter(d => d.facility === state.filters.facility);

      const getUnique = (key, dataArray) => [...new Set(dataArray.map(item => item[key]).filter(Boolean))].sort();
      
      const provs = getUnique('province', state.rawData);
      const dataForDistricts = state.filters.province !== 'All' ? state.rawData.filter(d => d.province === state.filters.province) : state.rawData;
      const dists = getUnique('district', dataForDistricts);
      
      let dataForFacilities = dataForDistricts;
      if (state.filters.district !== 'All') dataForFacilities = dataForFacilities.filter(d => d.district === state.filters.district);
      const facs = getUnique('facility', dataForFacilities);

      const total = filtered.length;
      const femaleCount = filtered.filter(d => d.gender?.toLowerCase().includes('female')).length;
      const maleCount = filtered.filter(d => d.gender?.toLowerCase() === 'male' || d.gender?.toLowerCase() === 'ຊາຍ').length;
      const femalePct = total > 0 ? ((femaleCount / total) * 100).toFixed(1) : 0;
      const malePct = total > 0 ? ((maleCount / total) * 100).toFixed(1) : 0;

      const skillUsingYesCount = filtered.filter(d => d.skillUsing?.toLowerCase().includes('yes')).length;
      const skillUsingYesPct = total > 0 ? ((skillUsingYesCount / total) * 100).toFixed(1) : 0;

      const getInsights = (field, maxQuotes = 3) => {
        const allText = filtered.map(d => d[field]).filter(text => text && text.trim().length > 5 && !['na', 'none', '-', 'ບໍ່ມີ'].includes(text.toLowerCase().trim()));
        const count = allText.length;
        const pct = total > 0 ? Math.round((count / total) * 100) : 0;
        
        const step = Math.max(1, Math.floor(count / maxQuotes));
        const quotes = [];
        for (let i = 0; i < count && quotes.length < maxQuotes; i += step) {
          if(allText[i]) quotes.push(allText[i]);
        }
        return { count, pct, quotes: quotes.slice(0, maxQuotes) };
      };

      return {
        filtered, provs, dists, facs,
        total, femaleCount, maleCount, femalePct, malePct,
        skillUsingYesCount, skillUsingYesPct,
        applied: getInsights('applied', 5),
        challenges: getInsights('challenges', 3),
        support: getInsights('support', 3)
      };
    };

    const render = () => {
      const t = translations[state.lang];
      const root = document.getElementById('root');
      const data = getComputedData();

      // Build Select Options Helper
      const buildOptions = (optionsArr, currentSelection) => {
        let html = `<option value="All">${t.all}</option>`;
        optionsArr.forEach(opt => {
          const selected = opt === currentSelection ? 'selected' : '';
          html += `<option value="${escapeHTML(opt)}" ${selected}>${escapeHTML(opt)}</option>`;
        });
        return html;
      };

      // Build Quotes block
      const buildQuotesHTML = (quotes, colorClass) => {
        return quotes.map(q => `
          <blockquote class="border-l-4 border-${colorClass}-500 bg-${colorClass}-50/50 p-3 rounded-r-lg text-slate-700 italic text-sm mb-3">
            "${escapeHTML(q)}"
          </blockquote>
        `).join('');
      };

      let mainContent = '';

      if (state.rawData.length === 0) {
        // Upload Prompt State
        mainContent = `
          <div class="flex flex-col items-center justify-center h-64 bg-white rounded-xl border border-dashed border-slate-300 shadow-sm mt-8">
            <i data-lucide="file-text" class="w-16 h-16 text-slate-300 mb-4"></i>
            <p class="text-slate-500 text-lg">${t.uploadPrompt}</p>
          </div>
        `;
      } else {
        // Dashboard State
        const recommendationBox = data.challenges.count > 0 ? `
          <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg flex items-start space-x-3 mt-5">
            <div class="bg-blue-100 p-1.5 rounded-full text-blue-600 flex-shrink-0 mt-0.5">
              <i data-lucide="lightbulb" class="w-4 h-4"></i>
            </div>
            <p class="text-sm text-blue-800 font-medium leading-relaxed">
              ${t.recommendationSec3}
            </p>
          </div>
        ` : '';

        const section1DataHTML = data.total > 0 ? `
            <div class="relative rounded-full flex items-center justify-center shadow-md mb-6 conic-transition"
                 style="width: 200px; height: 200px; background: conic-gradient(#ec4899 0% ${data.femalePct}%, #3b82f6 ${data.femalePct}% 100%)">
              <div class="w-36 h-36 bg-white rounded-full flex flex-col items-center justify-center shadow-inner z-10">
                <span class="text-3xl font-extrabold text-slate-800">${data.total}</span>
                <span class="text-xs text-slate-500 font-medium">${t.total}</span>
              </div>
            </div>

            <div class="w-full space-y-3">
              <div class="flex items-center justify-between p-2 rounded-lg bg-pink-50 border border-pink-100">
                <div class="flex items-center space-x-2">
                  <span class="w-3 h-3 rounded-full bg-pink-500"></span>
                  <span class="font-medium text-pink-900">${t.female}</span>
                </div>
                <span class="font-bold text-pink-700">${data.femaleCount} (${data.femalePct}%)</span>
              </div>
              <div class="flex items-center justify-between p-2 rounded-lg bg-blue-50 border border-blue-100">
                <div class="flex items-center space-x-2">
                  <span class="w-3 h-3 rounded-full bg-blue-500"></span>
                  <span class="font-medium text-blue-900">${t.male}</span>
                </div>
                <span class="font-bold text-blue-700">${data.maleCount} (${data.malePct}%)</span>
              </div>
            </div>

            <div class="w-full mt-4 pt-4 border-t border-slate-100">
              <div class="flex items-center justify-between p-2 rounded-lg bg-emerald-50 border border-emerald-100">
                <div class="flex items-center space-x-2">
                  <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                  <span class="font-medium text-emerald-900 text-sm">${t.appliedKnowledge}</span>
                </div>
                <span class="font-bold text-emerald-700">${data.skillUsingYesCount} (${data.skillUsingYesPct}%)</span>
              </div>
            </div>
        ` : `<p class="text-slate-400 italic">${t.noData}</p>`;

        mainContent = `
          <div class="space-y-6 mt-8">
            
            <!-- Filters -->
            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4">
              <!-- Province -->
              <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">${t.province}</label>
                <div class="relative">
                  <select class="w-full appearance-none bg-slate-50 border border-slate-300 text-slate-700 py-2.5 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer" onchange="updateFilter('province', this.value)">
                    ${buildOptions(data.provs, state.filters.province)}
                  </select>
                  <i data-lucide="chevron-down" class="absolute right-3 top-3 w-4 h-4 text-slate-500 pointer-events-none"></i>
                </div>
              </div>
              <!-- District -->
              <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">${t.district}</label>
                <div class="relative">
                  <select class="w-full appearance-none bg-slate-50 border border-slate-300 text-slate-700 py-2.5 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer" onchange="updateFilter('district', this.value)">
                    ${buildOptions(data.dists, state.filters.district)}
                  </select>
                  <i data-lucide="chevron-down" class="absolute right-3 top-3 w-4 h-4 text-slate-500 pointer-events-none"></i>
                </div>
              </div>
              <!-- Facility -->
              <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">${t.facility}</label>
                <div class="relative">
                  <select class="w-full appearance-none bg-slate-50 border border-slate-300 text-slate-700 py-2.5 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer" onchange="updateFilter('facility', this.value)">
                    ${buildOptions(data.facs, state.filters.facility)}
                  </select>
                  <i data-lucide="chevron-down" class="absolute right-3 top-3 w-4 h-4 text-slate-500 pointer-events-none"></i>
                </div>
              </div>
            </section>

            <!-- Grids -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              <!-- Section 1 -->
              <section class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm lg:col-span-1 flex flex-col">
                <div class="flex items-center space-x-2 mb-6">
                  <i data-lucide="activity" class="w-5 h-5 text-blue-500"></i>
                  <h2 class="text-lg font-bold text-slate-800">${t.sec1Title}</h2>
                </div>
                <div class="flex-grow flex flex-col items-center justify-center">
                  ${section1DataHTML}
                </div>
              </section>

              <!-- Sections 2, 3, 4 container -->
              <div class="lg:col-span-2 space-y-6">
                
                <!-- Section 2 -->
                <section class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                  <h2 class="text-lg font-bold text-slate-800 mb-3 border-b pb-2 flex items-center">
                    <span class="bg-green-100 text-green-700 p-1 rounded mr-2"><i data-lucide="activity" class="w-4 h-4"></i></span>
                    ${t.sec2Title}
                  </h2>
                  ${data.applied.count > 0 ? `
                    <p class="text-slate-600 mb-4 leading-relaxed">${t.summaryApplied(data.applied.count, data.total, data.applied.pct)}</p>
                    <div class="space-y-3">${buildQuotesHTML(data.applied.quotes, 'green')}</div>
                  ` : `<p class="text-slate-400 italic text-sm">${t.noData}</p>`}
                </section>

                <!-- Section 3 -->
                <section class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                  <h2 class="text-lg font-bold text-slate-800 mb-3 border-b pb-2 flex items-center">
                    <span class="bg-amber-100 text-amber-700 p-1 rounded mr-2"><i data-lucide="alert-circle" class="w-4 h-4"></i></span>
                    ${t.sec3Title}
                  </h2>
                  ${data.challenges.count > 0 ? `
                    <p class="text-slate-600 mb-4 leading-relaxed">${t.summaryChallenges(data.challenges.count, data.total, data.challenges.pct)}</p>
                    <div class="space-y-3">${buildQuotesHTML(data.challenges.quotes, 'amber')}</div>
                    ${recommendationBox}
                  ` : `<p class="text-slate-400 italic text-sm">${t.noData}</p>`}
                </section>

                <!-- Section 4 -->
                <section class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                  <h2 class="text-lg font-bold text-slate-800 mb-3 border-b pb-2 flex items-center">
                    <span class="bg-purple-100 text-purple-700 p-1 rounded mr-2"><i data-lucide="help-circle" class="w-4 h-4"></i></span>
                    ${t.sec4Title}
                  </h2>
                  ${data.support.count > 0 ? `
                    <p class="text-slate-600 mb-4 leading-relaxed">${t.summarySupport(data.support.count, data.total, data.support.pct)}</p>
                    <div class="space-y-3">${buildQuotesHTML(data.support.quotes, 'purple')}</div>
                  ` : `<p class="text-slate-400 italic text-sm">${t.noData}</p>`}
                </section>

              </div>
            </div>
          </div>
        `;
      }

      root.innerHTML = `
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-col md:flex-row items-center justify-between shadow-sm sticky top-0 z-10">
          <div class="flex items-center space-x-3 mb-4 md:mb-0">
            <div class="bg-blue-600 p-2 rounded-lg">
              <i data-lucide="pie-chart" class="text-white w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800">${t.title}</h1>
          </div>
          
          <div class="flex items-center space-x-4">
            <input type="file" accept=".csv" class="hidden" id="fileInput" onchange="handleFileUpload(event)" />
            <button onclick="triggerFileInput()" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md transition shadow-sm font-medium">
              <i data-lucide="upload" class="w-4 h-4"></i>
              <span>${t.uploadBtn}</span>
            </button>
            
            <button onclick="toggleLang()" class="flex items-center space-x-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-md transition font-medium border border-slate-300">
              <i data-lucide="languages" class="w-4 h-4"></i>
              <span>${state.lang === 'en' ? 'ລາວ' : 'English'}</span>
            </button>
          </div>
        </header>
        
        <main class="max-w-7xl mx-auto px-4 pb-8">
          ${mainContent}
        </main>
      `;

      // Re-initialize icons every time the DOM is re-rendered
      lucide.createIcons();
    };

    // Initialize application
    render();

  </script>
</body>
</html>
